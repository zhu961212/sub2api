# Layer over docker-compose.local.yml. The published custom image is the
# default; set SUB2API_IMAGE to pin a digest or use the local build fallback.
services:
  sub2api:
    image: ${SUB2API_IMAGE:-ghcr.io/zhu961212/sub2api:custom-v2}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${SUB2API_VERSION:-custom-v2}
        COMMIT: ${SUB2API_COMMIT:-local}
    labels:
      org.opencontainers.image.source: https://github.com/zhu961212/sub2api
      org.opencontainers.image.revision: ${SUB2API_COMMIT:-local}
